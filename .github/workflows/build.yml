name: Compilar aplicativo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Compilar Multitarefa.app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-app.sh

      - name: Guardar o aplicativo como artefato
        uses: actions/upload-artifact@v5
        with:
          name: Multitarefa
          path: dist/Multitarefa.dmg

      - name: Publicar na página de Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest dist/Multitarefa.dmg dist/version.json \
            --target "$GITHUB_SHA" \
            --title "Multitarefa $(tr -d '[:space:]' < VERSION).${{ github.run_number }}" \
            --notes "Faça o download do arquivo Multitarefa.dmg abaixo, abra-o e arraste o Multitarefa para a pasta Aplicativos. Na primeira execução, autorize o aplicativo em Ajustes do Sistema > Privacidade e Segurança > Abrir Mesmo Assim."
